<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чаты — {{ bot.name }}</title>
  <link rel="stylesheet" href="/static/tailwind.min.css">
  <style>
    .col-groups { background: #2b2b3b; }
    .group-nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; border-radius:10px; cursor:pointer; transition:background .15s; width:calc(100% - 8px); }
    .group-nav-item:hover { background:rgba(255,255,255,.08); }
    .group-nav-item.active { background:rgba(255,255,255,.14); }
    .group-nav-item .icon-wrap { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:13px; font-weight:700; flex-shrink:0; }
    .group-nav-item .label { font-size:10px; color:#b0b0c8; line-height:1.2; text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .group-nav-item.active .label { color:#fff; }
    .avatar-wrap { width:40px; height:40px; border-radius:50%; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .avatar-wrap img { width:100%; height:100%; object-fit:cover; }
    .resize-handle { width:5px; flex-shrink:0; cursor:col-resize; background:transparent; position:relative; z-index:10; transition:background .15s; }
    .resize-handle:hover, .resize-handle.dragging { background:#6366f1; }
    body.col-resizing { cursor:col-resize !important; user-select:none; }
    body.col-resizing * { cursor:col-resize !important; user-select:none !important; }
    /* профиль */
    .profile-tab { padding:6px 14px; font-size:12px; border-radius:6px; cursor:pointer; color:#6b7280; transition:all .15s; white-space:nowrap; }
    .profile-tab.active { background:#e0e7ff; color:#4338ca; font-weight:600; }
    .profile-tab:hover:not(.active) { background:#f3f4f6; color:#374151; }
    .media-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
    .media-thumb { aspect-ratio:1; background:#e5e7eb; border-radius:4px; overflow:hidden; cursor:pointer; position:relative; }
    .media-thumb img { width:100%; height:100%; object-fit:cover; }
    .media-thumb .type-icon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:#9ca3af; }
    /* вложения в пузырях */
    .att-image { max-width:220px; border-radius:10px; overflow:hidden; margin-top:4px; cursor:pointer; }
    .att-image img { display:block; width:100%; }
    .att-file { display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(0,0,0,.06); border-radius:8px; margin-top:4px; font-size:12px; }
    .att-audio { display:flex; align-items:center; gap:6px; padding:6px 10px; background:rgba(0,0,0,.06); border-radius:8px; margin-top:4px; font-size:12px; }
    .att-video { max-width:220px; border-radius:10px; overflow:hidden; margin-top:4px; }
    /* pending attachments & emoji picker */
    #pending-atts { display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px 0; }
    .pending-att-wrap { position:relative; width:60px; height:60px; border-radius:10px; overflow:hidden; background:#e5e7eb; flex-shrink:0; }
    .pending-att-wrap img { width:100%; height:100%; object-fit:cover; }
    .pending-att-icon { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .pending-att-overlay { position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
    .pending-att-remove { position:absolute; top:3px; right:3px; width:18px; height:18px; background:rgba(0,0,0,.55); border-radius:50%; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1; border:none; }
    .pending-att-remove:hover { background:rgba(200,0,0,.8); }
    #emoji-picker { position:absolute; bottom:calc(100% + 8px); right:0; width:276px; max-height:240px; overflow-y:auto; background:#fff; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.12); padding:8px; z-index:50; }
    #emoji-grid button { width:30px; height:30px; font-size:18px; border:none; background:none; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; }
    #emoji-grid button:hover { background:#f3f4f6; }
    @media (max-width: 767px) { .resize-handle { display:none; } }
  </style>
</head>
<body class="h-full bg-gray-100 overflow-hidden">

<div class="flex h-full" id="app">

  <!-- ── Колонка 1: группы (иконки) ─────────────────────────────────────── -->
  <div id="col-groups"
       class="col-groups flex flex-col shrink-0 py-2 items-center overflow-y-auto"
       style="width:64px;">

    <button data-group-id="all" data-group-name="Все"
            onclick="selectGroup(this)"
            class="group-btn group-nav-item active mt-1">
      <div class="icon-wrap" style="background:#4a4a6a;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#b0b0c8" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </div>
      <span class="label">Все</span>
    </button>

    <div id="group-list" class="flex flex-col gap-0.5 items-center w-full mt-1 flex-1"></div>

    <a href="/bots" title="К списку ботов" class="group-nav-item mb-1 mt-auto">
      <div class="icon-wrap" style="background:#3a3a4f;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0c8" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <span class="label">Боты</span>
    </a>
  </div>

  <div id="resize-handle-1" class="resize-handle hidden md:block"></div>

  <!-- ── Колонка 2: список пользователей ────────────────────────────────── -->
  <div id="col-users"
       class="flex flex-col bg-white border-r border-gray-200 shrink-0"
       style="width:288px;">

    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-100 shrink-0">
      <button id="back-to-groups" onclick="showGroupsOnMobile()"
              class="hidden text-gray-400 hover:text-gray-600 mr-1 p-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h2 id="col-users-title" class="font-semibold text-gray-800 text-sm flex-1">Все чаты</h2>
      <span id="users-count" class="text-xs text-gray-400"></span>
    </div>

    <div class="px-3 py-2 border-b border-gray-100 shrink-0">
      <input id="user-search" type="text" placeholder="Найти..."
             oninput="filterUsers(this.value)"
             class="w-full px-3 py-1.5 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
    </div>

    <div id="user-list" class="flex-1 overflow-y-auto">
      <div id="users-loading" class="flex items-center justify-center py-10 text-gray-400 text-sm">Загрузка...</div>
    </div>
  </div>

  <div id="resize-handle-2" class="resize-handle hidden md:block"></div>

  <!-- ── Колонка 3: чат ─────────────────────────────────────────────────── -->
  <div id="col-chat" class="flex-1 flex flex-col bg-gray-50 min-w-0">

    <!-- Шапка чата (кликабельна для открытия профиля) -->
    <div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-200 shrink-0">
      <button onclick="showUsersOnMobile()"
              class="text-gray-400 hover:text-gray-600 p-0.5 hidden" id="btn-back-users">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <!-- Кликабельный блок → открывает профиль -->
      <button id="chat-header-profile-btn"
              onclick="openProfile()"
              class="flex items-center gap-3 flex-1 min-w-0 text-left hover:opacity-80 transition-opacity disabled:opacity-100 disabled:cursor-default"
              disabled>
        <div id="chat-avatar-wrap" class="avatar-wrap hidden"
             style="background:#e0e7ff; color:#4338ca; font-weight:700; font-size:14px;">
        </div>
        <div class="flex-1 min-w-0">
          <div id="chat-name" class="font-semibold text-gray-800 text-sm truncate">Выберите чат</div>
          <div id="chat-sub" class="text-xs text-gray-400 truncate"></div>
        </div>
      </button>
      <button onclick="loadMessages()" id="refresh-btn"
              class="hidden text-gray-400 hover:text-indigo-600 p-1 rounded transition-colors" title="Обновить">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>

    <!-- Сообщения -->
    <div id="messages-area" class="flex-1 overflow-y-auto px-4 py-4 space-y-2">
      <div class="flex items-center justify-center h-full text-gray-400 text-sm">
        Выберите пользователя слева
      </div>
    </div>

    <!-- Инпут -->
    <div class="bg-white border-t border-gray-200 shrink-0">
      <!-- Превью pending-вложений -->
      <div id="pending-atts" class="hidden"></div>

      <div class="flex gap-2 items-end px-4 py-3">
        <!-- Кнопка прикрепить файл -->
        <button id="attach-btn" onclick="triggerFileInput()" title="Прикрепить файл"
                class="shrink-0 w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition-colors"
                disabled>
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
          </svg>
        </button>
        <input id="file-input" type="file" class="hidden" multiple
               accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.7z"
               onchange="handleFileSelect(event)">

        <!-- Текстовый инпут -->
        <textarea id="msg-input" rows="1"
                  placeholder="Написать сообщение..."
                  onkeydown="handleKey(event)"
                  oninput="autoResize(this); updateSendBtn();"
                  class="flex-1 resize-none px-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 max-h-32 overflow-y-auto"
                  disabled></textarea>

        <!-- Кнопка эмодзи + пикер -->
        <div class="relative shrink-0">
          <button id="emoji-btn" onclick="toggleEmojiPicker(event)" title="Эмодзи"
                  class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center text-lg transition-colors"
                  disabled>😊</button>
          <div id="emoji-picker" class="hidden">
            <div id="emoji-grid"></div>
          </div>
        </div>

        <!-- Отправить -->
        <button id="send-btn" onclick="sendMessage()"
                class="shrink-0 w-9 h-9 rounded-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition-colors"
                disabled>
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="resize-handle-3" class="resize-handle hidden md:block"></div>

  <!-- ── Колонка 4: профиль пользователя ───────────────────────────────── -->
  <div id="col-profile"
       class="flex flex-col bg-white border-l border-gray-200 shrink-0 hidden"
       style="width:320px; min-width:240px; max-width:500px;">

    <!-- Заголовок панели -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 shrink-0">
      <h3 class="font-semibold text-gray-800 text-sm">Профиль</h3>
      <button onclick="closeProfile()" class="text-gray-400 hover:text-gray-600 p-0.5 rounded" title="Закрыть">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Шапка профиля -->
    <div id="profile-header" class="px-4 py-4 border-b border-gray-100 shrink-0 hidden">
      <div class="flex items-center gap-3">
        <div id="profile-avatar" class="w-14 h-14 rounded-full flex-shrink-0 flex items-center justify-content: center overflow-hidden" style="font-size:20px;font-weight:700;"></div>
        <div class="min-w-0">
          <div id="profile-name" class="font-semibold text-gray-900 text-sm truncate"></div>
          <div id="profile-id" class="text-xs text-gray-400 mt-0.5"></div>
        </div>
      </div>
      <div id="profile-stats" class="mt-3 flex gap-4 text-center text-xs">
        <div><div id="profile-msg-count" class="font-semibold text-gray-800 text-base"></div><div class="text-gray-400">сообщений</div></div>
        <div><div id="profile-first" class="font-semibold text-gray-800 text-base"></div><div class="text-gray-400">первый контакт</div></div>
      </div>
    </div>

    <!-- Табы -->
    <div class="flex gap-1 px-3 py-2 border-b border-gray-100 shrink-0 overflow-x-auto" id="profile-tabs">
      <button class="profile-tab active" data-tab="overview" onclick="switchProfileTab(this)">Обзор</button>
      <button class="profile-tab" data-tab="media" onclick="switchProfileTab(this)">Медиа</button>
      <button class="profile-tab" data-tab="files" onclick="switchProfileTab(this)">Файлы</button>
      <button class="profile-tab" data-tab="voices" onclick="switchProfileTab(this)">Голосовые</button>
      <button class="profile-tab" data-tab="links" onclick="switchProfileTab(this)">Ссылки</button>
    </div>

    <!-- Содержимое профиля -->
    <div id="profile-content" class="flex-1 overflow-y-auto">
      <div class="flex items-center justify-center py-12 text-gray-400 text-sm" id="profile-loading">
        Загрузка...
      </div>
    </div>
  </div>

</div>

<script>
const BOT_ID = {{ bot.id }};
let currentGroupId = 'all';
let currentGroupName = 'Все';
let currentUserId = null;
let currentUserName = '';
let currentUserAvatar = null;
let allUsers = [];
let profileData = null;
let profileTab = 'overview';
let profileOpen = false;

// ── Инициализация ──────────────────────────────────────────────────────────

async function init() {
  buildEmojiPicker();
  await loadGroups();
  await loadUsers();
}

// ── Группы ─────────────────────────────────────────────────────────────────

async function loadGroups() {
  const res = await fetch(`/api/bots/${BOT_ID}/inbox/groups`);
  if (!res.ok) return;
  const groups = await res.json();
  const list = document.getElementById('group-list');
  list.innerHTML = '';
  for (const g of groups.slice(1)) {
    const initials2 = (g.name || '?').slice(0, 2).toUpperCase();
    const btn = document.createElement('button');
    btn.className = 'group-btn group-nav-item';
    btn.dataset.groupId = g.id;
    btn.dataset.groupName = g.name;
    btn.onclick = function() { selectGroup(this); };
    const badge = g.count > 0
      ? `<span style="position:absolute;top:-3px;right:-3px;background:#ef4444;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;">${g.count > 9 ? '9+' : g.count}</span>`
      : '';
    const iconContent = g.icon
      ? `<img src="${escHtml(g.icon)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : initials2;
    btn.innerHTML = `
      <div style="position:relative;">
        <div class="icon-wrap" style="background:#4a4a6a;color:#e0e0f0;">${iconContent}</div>
        ${badge}
      </div>
      <span class="label">${escHtml(g.name)}</span>`;
    if (g.icon) {
      const img = btn.querySelector('.icon-wrap img');
      if (img) img.onerror = function() { this.parentNode.textContent = initials2; };
    }
    list.appendChild(btn);
  }
}

function selectGroup(btn) {
  document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentGroupId = btn.dataset.groupId;
  currentGroupName = btn.dataset.groupName;
  document.getElementById('col-users-title').textContent = currentGroupName;
  currentUserId = null;
  currentUserAvatar = null;
  resetChat();
  loadUsers();
  showUsersOnMobile();
}

// ── Пользователи ───────────────────────────────────────────────────────────

async function loadUsers() {
  const list = document.getElementById('user-list');
  list.innerHTML = '<div class="flex items-center justify-center py-10 text-gray-400 text-sm">Загрузка...</div>';
  const res = await fetch(`/api/bots/${BOT_ID}/inbox/users?group_id=${currentGroupId}`);
  if (!res.ok) {
    list.innerHTML = '<div class="text-center py-8 text-red-400 text-sm">Ошибка загрузки</div>';
    return;
  }
  allUsers = await res.json();
  renderUsers(allUsers);
}

function renderUsers(users) {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  document.getElementById('users-count').textContent = users.length ? `${users.length}` : '';
  if (!users.length) {
    list.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Нет диалогов</div>';
    return;
  }
  for (const u of users) {
    const preview = u.last_message || '';
    const prefix = u.last_role === 'assistant' ? '↩ ' : '';
    const timeStr = u.last_at ? formatTime(u.last_at) : '';
    const avatarHtml = avatarTag(u.name, u.avatar, 40);
    const isActive = currentUserId === u.user_id;
    const unread = (!isActive && u.unread_count > 0)
      ? `<span class="unread-badge" style="background:#ef4444;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0;">${u.unread_count > 99 ? '99+' : u.unread_count}</span>`
      : '';
    const el = document.createElement('button');
    el.className = `user-item w-full text-left flex items-center gap-3 px-4 py-3 hover:bg-indigo-50 transition-colors border-b border-gray-50 ${isActive ? 'bg-indigo-50' : ''}`;
    el.dataset.userId = u.user_id;
    el.onclick = () => selectUser(u);
    el.innerHTML = `
      ${avatarHtml}
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-1">
          <span class="font-medium text-gray-800 text-sm truncate">${escHtml(u.name)}</span>
          <div class="flex items-center gap-1 shrink-0">
            ${unread}
            <span class="text-xs text-gray-400">${timeStr}</span>
          </div>
        </div>
        <div class="text-xs text-gray-500 truncate">${prefix}${escHtml(preview)}</div>
      </div>`;
    list.appendChild(el);
  }
}

function filterUsers(query) {
  const q = query.toLowerCase();
  const filtered = q ? allUsers.filter(u => u.name.toLowerCase().includes(q) || u.user_id.includes(q)) : allUsers;
  renderUsers(filtered);
}

function selectUser(u) {
  currentUserId = u.user_id;
  currentUserName = u.name;
  currentUserAvatar = u.avatar;

  document.querySelectorAll('.user-item').forEach(el => {
    el.classList.toggle('bg-indigo-50', el.dataset.userId === u.user_id);
    if (el.dataset.userId === u.user_id) {
      el.querySelectorAll('.unread-badge').forEach(b => b.remove());
    }
  });

  // шапка чата
  const wrap = document.getElementById('chat-avatar-wrap');
  wrap.classList.remove('hidden');
  if (u.avatar) {
    wrap.innerHTML = `<img src="${escHtml(u.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML='${escHtml(initials(u.name))}'">`;
  } else {
    wrap.innerHTML = initials(u.name);
    wrap.style.background = avatarColor(u.name);
    wrap.style.color = '#fff';
  }
  document.getElementById('chat-name').textContent = u.name;
  document.getElementById('chat-sub').textContent = `ID: ${u.user_id}`;
  document.getElementById('refresh-btn').classList.remove('hidden');
  document.getElementById('chat-header-profile-btn').disabled = false;

  document.getElementById('msg-input').disabled = false;
  document.getElementById('attach-btn').disabled = false;
  document.getElementById('emoji-btn').disabled = false;
  document.getElementById('msg-input').focus();
  updateSendBtn();

  // Если профиль открыт — перезагружаем для нового пользователя
  if (profileOpen) loadProfile();

  loadMessages();
  showChatOnMobile();
}

// ── Сообщения ──────────────────────────────────────────────────────────────

async function loadMessages() {
  if (!currentUserId) return;
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div class="flex justify-center py-6 text-gray-400 text-sm">Загрузка...</div>';
  const res = await fetch(`/api/bots/${BOT_ID}/inbox/messages?user_id=${encodeURIComponent(currentUserId)}&group_id=${currentGroupId}`);
  if (!res.ok) {
    area.innerHTML = '<div class="flex justify-center py-6 text-red-400 text-sm">Ошибка загрузки</div>';
    return;
  }
  const msgs = await res.json();
  renderMessages(msgs);
}

function renderMessages(msgs) {
  const area = document.getElementById('messages-area');
  if (!msgs.length) {
    area.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400 text-sm">Нет сообщений</div>';
    return;
  }
  area.innerHTML = '';
  let lastDate = '';
  for (const m of msgs) {
    const isBot = m.role === 'assistant';
    const dt = new Date(m.created_at);
    const dateStr = dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    if (dateStr !== lastDate) {
      const sep = document.createElement('div');
      sep.className = 'flex justify-center my-2';
      sep.innerHTML = `<span class="text-xs text-gray-400 bg-gray-100 rounded-full px-3 py-0.5">${dateStr}</span>`;
      area.appendChild(sep);
      lastDate = dateStr;
    }
    const bubble = document.createElement('div');
    bubble.className = `flex gap-2 ${isBot ? 'justify-end' : 'justify-start'} items-end`;
    const timeStr = dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const attsHtml = renderAttachments(m.attachments || [], isBot);

    if (!isBot) {
      const av = avatarTag(currentUserName, currentUserAvatar, 28);
      bubble.innerHTML = `
        <div class="shrink-0 self-end">${av}</div>
        <div class="max-w-xs sm:max-w-md lg:max-w-lg px-3 py-2 rounded-2xl rounded-bl-sm text-sm shadow-sm bg-white text-gray-800 border border-gray-100">
          ${m.content ? `<div class="whitespace-pre-wrap break-words">${escHtml(m.content)}</div>` : ''}
          ${attsHtml}
          <div class="text-xs mt-1 text-gray-400 text-right">${timeStr}</div>
        </div>`;
    } else {
      bubble.innerHTML = `
        <div class="max-w-xs sm:max-w-md lg:max-w-lg px-3 py-2 rounded-2xl rounded-br-sm text-sm shadow-sm bg-indigo-600 text-white">
          ${m.content ? `<div class="whitespace-pre-wrap break-words">${escHtml(m.content)}</div>` : ''}
          ${attsHtml}
          <div class="text-xs mt-1 text-indigo-200 text-right">${timeStr}</div>
        </div>`;
    }
    area.appendChild(bubble);
  }
  area.scrollTop = area.scrollHeight;
}

function renderAttachments(atts, isBot) {
  if (!atts || !atts.length) return '';
  return atts.map(att => {
    const t = att.type || '';
    if (t === 'image') {
      if (att.preview_url) {
        return `<div class="att-image"><img src="${escHtml(att.preview_url)}" alt="Фото" loading="lazy" onerror="this.parentNode.innerHTML='<div style=padding:8px;font-size:12px;>📷 Фото</div>'"></div>`;
      }
      return `<div class="att-file" style="color:${isBot?'rgba(255,255,255,.8)':'#6b7280'}">📷 Фото</div>`;
    }
    if (t === 'video') {
      if (att.preview_url) {
        return `<div class="att-video"><img src="${escHtml(att.preview_url)}" alt="Видео" loading="lazy" style="width:100%;"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">▶</div></div>`;
      }
      return `<div class="att-file" style="color:${isBot?'rgba(255,255,255,.8)':'#6b7280'}">🎥 Видео</div>`;
    }
    if (t === 'audio') {
      return `<div class="att-audio" style="color:${isBot?'rgba(255,255,255,.8)':'#6b7280'}"><span>🎤</span><span>Голосовое сообщение</span></div>`;
    }
    if (t === 'file') {
      const fname = att.filename ? escHtml(att.filename) : 'Файл';
      const fsize = att.size ? ` (${formatSize(att.size)})` : '';
      return `<div class="att-file" style="color:${isBot?'rgba(255,255,255,.8)':'#6b7280'}"><span>📎</span><span>${fname}${fsize}</span></div>`;
    }
    if (t === 'share' && att.url) {
      return `<div class="att-file" style="color:${isBot?'rgba(255,255,255,.8)':'#6b7280'}">🔗 <a href="${escHtml(att.url)}" target="_blank" rel="noopener" style="text-decoration:underline;">${escHtml(att.url.slice(0,50))}${att.url.length>50?'…':''}</a></div>`;
    }
    return '';
  }).join('');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' КБ';
  return (bytes / 1048576).toFixed(1) + ' МБ';
}

async function openProfile() {
  if (!currentUserId) return;
  profileOpen = true;
  document.getElementById('col-profile').classList.remove('hidden');
  await loadProfile();
}

function closeProfile() {
  profileOpen = false;
  document.getElementById('col-profile').classList.add('hidden');
}

async function loadProfile() {
  if (!currentUserId) return;
  document.getElementById('profile-header').classList.add('hidden');
  document.getElementById('profile-content').innerHTML =
    '<div class="flex items-center justify-center py-12 text-gray-400 text-sm">Загрузка...</div>';

  const res = await fetch(`/api/bots/${BOT_ID}/inbox/profile/${encodeURIComponent(currentUserId)}`);
  if (!res.ok) {
    document.getElementById('profile-content').innerHTML =
      '<div class="text-center py-8 text-red-400 text-sm">Ошибка загрузки</div>';
    return;
  }
  profileData = await res.json();
  renderProfileHeader(profileData);
  renderProfileTab(profileTab);
}

function renderProfileHeader(p) {
  // Аватар
  const avatarEl = document.getElementById('profile-avatar');
  const bg = avatarColor(p.name || '');
  if (p.avatar) {
    avatarEl.innerHTML = `<img src="${escHtml(p.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextSibling.style.display='flex'">
      <div style="display:none;width:100%;height:100%;background:${bg};color:#fff;align-items:center;justify-content:center;">${escHtml(initials(p.name))}</div>`;
  } else {
    avatarEl.style.background = bg;
    avatarEl.style.color = '#fff';
    avatarEl.textContent = initials(p.name);
  }
  document.getElementById('profile-name').textContent = p.name;
  document.getElementById('profile-id').textContent = `ID: ${p.user_id}`;
  const totalMsgs = (p.user_msg_count || 0) + (p.bot_msg_count || 0);
  document.getElementById('profile-msg-count').textContent = totalMsgs;
  const firstDt = new Date(p.first_contact);
  document.getElementById('profile-first').textContent =
    firstDt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  document.getElementById('profile-header').classList.remove('hidden');
}

function switchProfileTab(btn) {
  document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  profileTab = btn.dataset.tab;
  if (profileData) renderProfileTab(profileTab);
}

function renderProfileTab(tab) {
  const content = document.getElementById('profile-content');
  if (!profileData) return;
  const p = profileData;

  if (tab === 'overview') {
    let groupsHtml = '';
    if (p.groups && p.groups.length) {
      groupsHtml = `<div class="mt-3">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Группы</div>
        ${p.groups.map(g => `<div class="flex items-center gap-2 py-1.5 text-sm text-gray-700">
          <span class="w-5 h-5 bg-indigo-100 rounded flex items-center justify-center text-indigo-600 text-xs flex-shrink-0">👥</span>
          ${escHtml(g.group_name)}
        </div>`).join('')}
      </div>`;
    }
    const lastDt = new Date(p.last_active);
    content.innerHTML = `
      <div class="px-4 py-3 space-y-1 text-sm">
        <div class="flex justify-between py-1.5 border-b border-gray-50">
          <span class="text-gray-500">Сообщений от пользователя</span>
          <span class="font-medium text-gray-800">${p.user_msg_count}</span>
        </div>
        <div class="flex justify-between py-1.5 border-b border-gray-50">
          <span class="text-gray-500">Ответов бота</span>
          <span class="font-medium text-gray-800">${p.bot_msg_count}</span>
        </div>
        <div class="flex justify-between py-1.5 border-b border-gray-50">
          <span class="text-gray-500">Последняя активность</span>
          <span class="font-medium text-gray-800">${lastDt.toLocaleDateString('ru-RU', {day:'numeric',month:'short',year:'numeric'})}</span>
        </div>
        <div class="flex justify-between py-1.5">
          <span class="text-gray-500">Вложений (медиа/файлы)</span>
          <span class="font-medium text-gray-800">${(p.media||[]).length + (p.files||[]).length + (p.voices||[]).length}</span>
        </div>
        ${groupsHtml}
      </div>`;
    return;
  }

  if (tab === 'media') {
    const items = p.media || [];
    if (!items.length) {
      content.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Нет медиа</div>';
      return;
    }
    content.innerHTML = `<div class="media-grid p-2">
      ${items.map(att => {
        if (att.preview_url) {
          return `<div class="media-thumb"><img src="${escHtml(att.preview_url)}" loading="lazy" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="type-icon" style="display:none">${att.type==='video'?'🎥':'📷'}</div></div>`;
        }
        return `<div class="media-thumb"><div class="type-icon">${att.type==='video'?'🎥':'📷'}</div></div>`;
      }).join('')}
    </div>`;
    return;
  }

  if (tab === 'files') {
    const items = p.files || [];
    if (!items.length) {
      content.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Нет файлов</div>';
      return;
    }
    content.innerHTML = `<div class="divide-y divide-gray-50">
      ${items.map(att => {
        const dt = new Date(att.date);
        const fname = att.filename || 'Файл';
        const fsize = att.size ? formatSize(att.size) : '';
        return `<div class="flex items-center gap-3 px-4 py-2.5">
          <span class="text-xl flex-shrink-0">📎</span>
          <div class="min-w-0 flex-1">
            <div class="text-sm text-gray-800 truncate">${escHtml(fname)}</div>
            <div class="text-xs text-gray-400">${fsize ? fsize + ' · ' : ''}${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  if (tab === 'voices') {
    const items = p.voices || [];
    if (!items.length) {
      content.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Нет голосовых</div>';
      return;
    }
    content.innerHTML = `<div class="divide-y divide-gray-50">
      ${items.map(att => {
        const dt = new Date(att.date);
        return `<div class="flex items-center gap-3 px-4 py-2.5">
          <span class="text-xl flex-shrink-0">🎤</span>
          <div class="min-w-0 flex-1">
            <div class="text-sm text-gray-800">Голосовое сообщение</div>
            <div class="text-xs text-gray-400">${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})} · ${dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  if (tab === 'links') {
    const items = p.links || [];
    if (!items.length) {
      content.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Нет ссылок</div>';
      return;
    }
    content.innerHTML = `<div class="divide-y divide-gray-50">
      ${items.map(lnk => {
        const dt = new Date(lnk.date);
        const domain = (() => { try { return new URL(lnk.url).hostname; } catch { return lnk.url.slice(0,30); } })();
        return `<div class="px-4 py-2.5">
          <a href="${escHtml(lnk.url)}" target="_blank" rel="noopener"
             class="text-sm text-indigo-600 hover:underline block truncate" title="${escHtml(lnk.url)}">${escHtml(lnk.url)}</a>
          <div class="text-xs text-gray-400 mt-0.5">${escHtml(domain)} · ${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }
}

// ── Отправка ───────────────────────────────────────────────────────────────

async function sendMessage() {
  if (!currentUserId) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  const readyAtts = pendingAtts.filter(a => !a.uploading && !a.error && a.token);
  if (!text && !readyAtts.length) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  input.disabled = true;
  document.getElementById('attach-btn').disabled = true;
  document.getElementById('emoji-btn').disabled = true;

  const attachments = readyAtts.map(a => {
    const o = { type: a.type, token: a.token, size: a.size };
    if (a.filename) o.filename = a.filename;
    return o;
  });

  try {
    const res = await fetch(`/api/bots/${BOT_ID}/inbox/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: currentUserId,
        text,
        attachments: attachments.length ? attachments : undefined,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Ошибка отправки: ' + (err.detail || res.statusText));
      return;
    }
    input.value = '';
    input.style.height = '';
    clearPendingAtts();
    await loadMessages();
    await loadUsers();
  } finally {
    btn.disabled = false;
    input.disabled = false;
    document.getElementById('attach-btn').disabled = false;
    document.getElementById('emoji-btn').disabled = false;
    input.focus();
    updateSendBtn();
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}

function resetChat() {
  currentUserId = null;
  currentUserName = '';
  currentUserAvatar = null;
  profileData = null;
  clearPendingAtts();
  document.getElementById('chat-avatar-wrap').classList.add('hidden');
  document.getElementById('chat-name').textContent = 'Выберите чат';
  document.getElementById('chat-sub').textContent = '';
  document.getElementById('refresh-btn').classList.add('hidden');
  document.getElementById('chat-header-profile-btn').disabled = true;
  document.getElementById('msg-input').disabled = true;

  document.getElementById('emoji-picker').classList.add('hidden');
  document.getElementById('messages-area').innerHTML =
    '<div class="flex items-center justify-center h-full text-gray-400 text-sm">Выберите пользователя слева</div>';
  closeProfile();
}

// ── Pending attachments ───────────────────────────────────────────────────

let pendingAtts = []; // {id, type, token, filename, size, previewUrl, uploading, error}
let _attIdSeq = 0;

function triggerFileInput() {
  document.getElementById('file-input').click();
}

function guessAttType(mime) {
  if (mime.startsWith('image/')) return 'image';
  if (mime.startsWith('video/')) return 'video';
  if (mime.startsWith('audio/')) return 'audio';
  return 'file';
}

async function handleFileSelect(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  for (const file of files) {
    if (file.size > 20 * 1024 * 1024) {
      alert(`Файл "${file.name}" слишком большой (максимум 20 МБ)`);
      continue;
    }
    const id = ++_attIdSeq;
    const type = guessAttType(file.type);
    const previewUrl = (type === 'image') ? URL.createObjectURL(file) : null;
    const att = { id, type, filename: file.name, size: file.size, token: null, previewUrl, uploading: true, error: null };
    pendingAtts.push(att);
    renderPendingAtts();

    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch(`/api/bots/${BOT_ID}/inbox/upload`, { method: 'POST', body: fd });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        att.error = err.detail || 'Ошибка загрузки';
      } else {
        const data = await res.json();
        att.token = data.attachment.token;
        att.type  = data.type;
        if (data.attachment.filename) att.filename = data.attachment.filename;
      }
    } catch (_) {
      att.error = 'Ошибка сети';
    }
    att.uploading = false;
    renderPendingAtts();
    updateSendBtn();
  }
}

function removeAtt(id) {
  const att = pendingAtts.find(a => a.id === id);
  if (att?.previewUrl) URL.revokeObjectURL(att.previewUrl);
  pendingAtts = pendingAtts.filter(a => a.id !== id);
  renderPendingAtts();
  updateSendBtn();
}

function clearPendingAtts() {
  pendingAtts.forEach(a => { if (a.previewUrl) URL.revokeObjectURL(a.previewUrl); });
  pendingAtts = [];
  renderPendingAtts();
}

function renderPendingAtts() {
  const wrap = document.getElementById('pending-atts');
  if (!pendingAtts.length) {
    wrap.classList.add('hidden');
    wrap.innerHTML = '';
    return;
  }
  wrap.classList.remove('hidden');
  const ATT_ICONS = { image:'📷', video:'🎥', audio:'🎤', file:'📎' };
  wrap.innerHTML = pendingAtts.map(att => {
    const icon = ATT_ICONS[att.type] || '📎';
    const thumb = (att.previewUrl)
      ? `<img src="${escHtml(att.previewUrl)}" alt="">`
      : `<div class="pending-att-icon">${icon}</div>`;
    const overlay = att.uploading
      ? `<div class="pending-att-overlay"><svg class="w-5 h-5 text-white animate-spin" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10"/></svg></div>`
      : att.error
      ? `<div class="pending-att-overlay" title="${escHtml(att.error)}" style="background:rgba(185,28,28,.55);"><span style="color:#fff;font-size:18px;">✕</span></div>`
      : '';
    return `<div class="pending-att-wrap">${thumb}${overlay}<button class="pending-att-remove" onclick="removeAtt(${att.id})" title="Убрать">✕</button></div>`;
  }).join('');
}

function updateSendBtn() {
  const btn = document.getElementById('send-btn');
  const input = document.getElementById('msg-input');
  if (!currentUserId || !btn || !input) return;
  const hasText = input.value.trim().length > 0;
  const hasReady = pendingAtts.some(a => !a.uploading && !a.error && a.token);
  btn.disabled = !hasText && !hasReady;
}

  document.getElementById('emoji-picker').classList.toggle('hidden');
}

  ta.value = ta.value.slice(0, s) + em + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = s + em.length;
  ta.focus();
  autoResize(ta);
  updateSendBtn();

  document.getElementById('col-chat').style.display = 'none';
  document.getElementById('col-profile').classList.add('hidden');

  document.getElementById('col-chat').style.display = 'none';

function applyLayout() {
  const mobile = isMobile();
  if (!mobile) {
    document.getElementById('col-groups').style.display = '';

    document.getElementById('col-chat').style.display = '';
    document.getElementById('back-to-groups').classList.add('hidden');
    document.getElementById('btn-back-users').classList.add('hidden');
  } else {
    if (currentUserId) showChatOnMobile();
    else showUsersOnMobile();
  }
}

window.addEventListener('resize', applyLayout);

// ── Утилиты ────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function initials(name) {
  return String(name || '?').slice(0, 2).toUpperCase();
}

const AVATAR_COLORS = ['#5b7fd4','#7b5ea7','#4a9e7f','#c0713a','#a84b6a','#4a7a9b','#7a6b4a'];
function avatarColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

function avatarTag(name, url, size) {
  const s = size || 40;
  const bg = avatarColor(name || '');
  if (url) {
    return `<div class="avatar-wrap" style="width:${s}px;height:${s}px;flex-shrink:0;">
      <img src="${escHtml(url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"
           onerror="this.style.display='none';this.nextSibling.style.display='flex';">
      <div style="display:none;width:100%;height:100%;background:${bg};color:#fff;font-weight:700;font-size:${Math.round(s*0.35)}px;align-items:center;justify-content:center;border-radius:50%;">${initials(name)}</div>
    </div>`;
  }
  return `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${bg};color:#fff;font-weight:700;font-size:${Math.round(s*0.35)}px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${initials(name)}</div>`;
}

function formatTime(isoStr) {
  const dt = new Date(isoStr);
  const now = new Date();
  if (dt.getDate() === now.getDate() && now - dt < 86400000) {
    return dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

// ── Resize колонок ────────────────────────────────────────────────────────

const RESIZE_LIMITS = {
  groups:  { min: 56,  max: 240 },
  users:   { min: 200, max: 600 },
  profile: { min: 240, max: 500 },
};

function loadColumnWidths() {
  const wg = parseInt(localStorage.getItem('inbox-w-groups')  || '', 10);
  const wu = parseInt(localStorage.getItem('inbox-w-users')   || '', 10);
  const wp = parseInt(localStorage.getItem('inbox-w-profile') || '', 10);
  if (wg && wg >= RESIZE_LIMITS.groups.min  && wg <= RESIZE_LIMITS.groups.max)  document.getElementById('col-groups').style.width  = wg + 'px';
  if (wu && wu >= RESIZE_LIMITS.users.min   && wu <= RESIZE_LIMITS.users.max)   document.getElementById('col-users').style.width   = wu + 'px';
  if (wp && wp >= RESIZE_LIMITS.profile.min && wp <= RESIZE_LIMITS.profile.max) document.getElementById('col-profile').style.width = wp + 'px';
}

function setupResize(handleId, colId, storageKey, limits) {
  const handle = document.getElementById(handleId);
  const col    = document.getElementById(colId);
  if (!handle || !col) return;
  let startX = 0, startW = 0;
  function onMove(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    // Для правой панели — resize в обратную сторону
    const delta = colId === 'col-profile' ? (startX - x) : (x - startX);
    let w = Math.max(limits.min, Math.min(limits.max, startW + delta));
    col.style.width = w + 'px';
  }
  function onUp() {
    handle.classList.remove('dragging');
    document.body.classList.remove('col-resizing');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend',  onUp);
    localStorage.setItem(storageKey, parseInt(col.style.width, 10));
  }
  function onDown(e) {
    if (window.innerWidth < 768) return;
    e.preventDefault();
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = col.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.classList.add('col-resizing');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend',  onUp);
  }
  handle.addEventListener('mousedown',  onDown);
  handle.addEventListener('touchstart', onDown, { passive: false });
  handle.addEventListener('dblclick', () => {
    const defaults = { 'col-groups': 64, 'col-users': 288, 'col-profile': 320 };
    col.style.width = (defaults[colId] || 288) + 'px';
    localStorage.removeItem(storageKey);
  });
}

loadColumnWidths();
setupResize('resize-handle-1', 'col-groups',  'inbox-w-groups',  RESIZE_LIMITS.groups);
setupResize('resize-handle-2', 'col-users',   'inbox-w-users',   RESIZE_LIMITS.users);
setupResize('resize-handle-3', 'col-profile', 'inbox-w-profile', RESIZE_LIMITS.profile);

applyLayout();
init();
</script>
