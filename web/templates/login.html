<!DOCTYPE html>
<html lang="ru" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — MaxBot</title>
  <link rel="stylesheet" href="/static/tailwind.min.css">
</head>
<body class="h-full flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <span class="text-5xl">🤖</span>
      <h1 class="mt-3 text-3xl font-bold text-gray-900">MaxBot Dashboard</h1>
      <p class="mt-1 text-sm text-gray-500">Управление ботом в мессенджере Max</p>
    </div>

    <div class="bg-white shadow-md rounded-xl px-8 py-8">
      {% if error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required autofocus
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                        text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
          <input type="password" name="password" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                        text-sm" />
        </div>
        <button type="submit"
                class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white
                       font-medium rounded-lg text-sm transition-colors shadow-sm">
          Войти
        </button>
      </form>
    </div>
  </div>
</body>
</html>
